<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1120" />
    <meta name="description" content="Sòl Ansanm : gestion numérique des sols et tontines communautaires. Suivez les cotisations, les tours de versement et le tableau de bord financier de votre sol, simplement, sans erreur de calcul ni conflit entre membres." />
    <title>Sòl Ansanm</title>

    <!-- Chargées en HTML (pas en CSS @import) : disponibles plus tôt,
         en parallèle du reste, ce qui évite le décalage visuel (CLS)
         causé par le texte qui change de police après coup. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />

    <script>
      (function () {
        try {
          var enregistre = localStorage.getItem('soltrack_theme');
          var systemeClair = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = enregistre || (systemeClair ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
